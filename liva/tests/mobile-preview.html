<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LIVA · Responsive QA</title><style>body{margin:0;background:#deded5;font:12px Arial;color:#555;display:flex;justify-content:center}iframe{flex-shrink:0;width:390px;height:844px;border:0;background:#fcfbf8;display:block;box-shadow:0 0 35px #0001}aside{position:fixed;top:24px;left:14px;width:190px;line-height:1.7}a{color:#333}label{display:block}select{width:160px;margin:5px 0 10px;padding:7px}#result{max-width:180px;font-size:11px}</style></head><body><aside>LIVA · Responsive QA<label>Viewport width<select id="width"><option>320</option><option>360</option><option selected>390</option><option>768</option><option>820</option><option>1024</option><option>1440</option></select></label><label>Viewport height<select id="height"><option>360</option><option>600</option><option selected>844</option></select></label><label>Page<select id="route"><option value="home">Home</option><option value="shop">Shop</option><option value="product/shampoo">Product</option><option value="routine">Shelf builder</option><option value="compare">Comparison</option><option value="about">About</option><option value="checkout">Checkout</option><option value="account">Account</option><option value="contact">Contact</option><option value="tracking">Tracking</option><option value="wishlist">Wishlist</option></select></label><p id="result" role="status"></p><p id="campaign-report"></p><a href="../">Open storefront</a></aside><iframe title="LIVA mobile storefront" src="../index.html?review=7"></iframe><script>
const p=new URLSearchParams(location.search),f=document.querySelector('iframe'),w=document.querySelector('#width'),h=document.querySelector('#height'),r=document.querySelector('#route');w.value=p.get('width')||'390';h.value=p.get('height')||'844';r.value=p.get('route')||'home';function size(){f.style.width=w.value+'px';f.style.height=h.value+'px';check();}function check(){const d=f.contentDocument;if(!d||!d.body)return;const bad=[...d.images].filter(i=>i.complete&&i.naturalWidth===0);document.querySelector('#result').textContent='Viewport: '+d.documentElement.clientWidth+' × '+h.value+'. Content width: '+d.documentElement.scrollWidth+'. Broken images: '+bad.length+'. Page: '+(d.location.hash||'#home')+'.';if(d.documentElement.scrollWidth>d.documentElement.clientWidth){const over=[...d.body.querySelectorAll('*')].filter(el=>{const b=el.getBoundingClientRect();return b.width>0&&b.right>d.documentElement.clientWidth+1;}).filter(el=>typeof el.className==='string').slice(0,12).map(el=>el.tagName+'.'+el.className+' ['+Math.round(el.getBoundingClientRect().width)+']');document.querySelector('#result').textContent+=' Overflow: '+over.join(', ');const e=d.querySelector('.edit-layout');if(e)document.querySelector('#result').textContent+=' Grid: '+f.contentWindow.getComputedStyle(e).gridTemplateColumns+'; child min '+f.contentWindow.getComputedStyle(e.lastElementChild).minWidth;}}w.onchange=h.onchange=size;r.onchange=()=>{f.src='../index.html?review=7#'+r.value;};f.onload=()=>{size();f.contentWindow.addEventListener('hashchange',check);new ResizeObserver(check).observe(f.contentDocument.body);};if(r.value!=='home')f.src='../index.html?review=7#'+r.value;size();
setInterval(()=>{const d=f.contentDocument,hero=d&&d.querySelector('.campaign-hero'),v=hero&&hero.querySelector('video');document.querySelector('#campaign-report').textContent=hero?'Story: '+hero.querySelector('.is-active').getAttribute('aria-label')+'. Running: '+hero.dataset.running+'. User paused: '+hero.dataset.paused+'. Video: '+v.readyState+', '+v.currentTime.toFixed(1)+'s, '+(v.paused?'paused':'playing')+'. Source: '+(v.currentSrc.split('/').pop()||'poster only')+'. Menu visible: '+(!!d.querySelector('.mobile-nav').getClientRects().length)+'.':'';},250);
</script></body></html>
